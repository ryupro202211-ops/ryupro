<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | ryupro ブログ</title>
  <meta name="description" content="{{EXCERPT}}">
  <link rel="canonical" href="{{URL}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="合同会社ryupro">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{EXCERPT}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{IMAGE}}">
  <meta property="article:published_time" content="{{DATE_ISO}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{EXCERPT}}">
  <meta name="twitter:image" content="{{IMAGE}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../blog.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/ryupro/" class="nav-logo">ryupro</a>
    <a href="/ryupro/blog/" class="nav-back">&larr; ブログ一覧に戻る</a>
  </div>
</nav>
<main class="article-wrapper">
  <div class="article-date">{{DATE}}</div>
  <h1 class="article-title">{{TITLE}}</h1>
{{HERO}}  <div class="article-body">{{CONTENT}}</div>
  <a href="/ryupro/blog/" class="article-back">&larr; ブログ一覧に戻る</a>
</main>
<footer>
  <div class="footer-logo">ryupro</div>
  <div class="footer-copy">&copy; 2024 ryupro LLC. All Rights Reserved.</div>
</footer>
</body>
</html>
