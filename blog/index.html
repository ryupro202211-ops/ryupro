<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ | 合同会社ryupro</title>
  <meta name="description" content="合同会社ryuproのブログ。イベント情報やコラムをお届けします。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-bg: #111110;
      --color-bg-soft: #161514;
      --color-bg-card: #1a1918;
      --color-text: #a99f92;
      --color-text-strong: #e8e2d8;
      --color-text-dim: #6b655c;
      --color-gold: #dbc5a4;
      --color-gold-dim: rgba(219,197,164,0.4);
      --color-border: #2a2825;
      --font-ja: 'Noto Sans JP', sans-serif;
      --font-serif: 'Shippori Mincho', serif;
      --font-en: 'Outfit', sans-serif;
      --max-width: 1080px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ja);
      font-weight: 300;
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 2;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--color-gold); color: #111110; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(17,17,16,0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(42,40,37,0.6);
    }
    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .nav-logo {
      font-family: var(--font-en);
      font-weight: 400;
      font-size: 1.25rem;
      letter-spacing: 0.28em;
      color: var(--color-gold);
      text-decoration: none;
    }
    .nav-back {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--color-text);
      text-decoration: none;
      transition: color 0.4s;
    }
    .nav-back:hover { color: var(--color-gold); }
    .page-header {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 9.5rem 2rem 3.5rem;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--color-text-dim);
      margin-bottom: 1.75rem;
    }
    .section-label::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--color-gold-dim);
    }
    .section-label .en {
      font-family: var(--font-en);
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }
    .section-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(1.6rem, 3.4vw, 2.2rem);
      letter-spacing: 0.12em;
      color: var(--color-gold);
    }
    .blog-list {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 2rem 6rem;
    }
    .blog-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2.5rem;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
      color: inherit;
    }
    .blog-card:first-child { border-top: 1px solid var(--color-border); }
    .blog-card-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--color-bg-card);
      overflow: hidden;
      border: 1px solid var(--color-border);
    }
    .blog-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.85);
      transition: transform 1.2s var(--ease), filter 1.2s var(--ease);
    }
    .blog-card:hover .blog-card-img img { transform: scale(1.05); filter: saturate(1); }
    .blog-card-date {
      font-family: var(--font-en);
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--color-gold);
      margin-bottom: 0.75rem;
    }
    .blog-card-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--color-text-strong);
      margin-bottom: 0.75rem;
      line-height: 1.9;
      transition: color 0.5s;
    }
    .blog-card:hover .blog-card-title { color: var(--color-gold); }
    .blog-card-excerpt {
      font-size: 0.85rem;
      color: var(--color-text);
      line-height: 2.1;
    }
    footer {
      padding: 4rem 2rem 3.5rem;
      text-align: center;
      border-top: 1px solid var(--color-border);
    }
    .footer-logo {
      font-family: var(--font-en);
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.32em;
      margin-bottom: 1rem;
      color: var(--color-gold);
    }
    .footer-copy {
      font-family: var(--font-en);
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }
    @media (max-width: 768px) {
      .blog-card {
        grid-template-columns: 1fr;
        gap: 1.25rem;
        padding: 2rem 0;
      }
      .blog-card-img { max-width: 100%; }
      .page-header { padding: 8rem 1.5rem 2.5rem; }
      .blog-list { padding: 0 1.5rem 4.5rem; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/ryupro/" class="nav-logo">ryupro</a>
    <a href="/ryupro/" class="nav-back">&larr; トップに戻る</a>
  </div>
</nav>

<header class="page-header">
  <div class="section-label">ブログ<span class="en">Blog</span></div>
  <h1 class="section-title">日々のこと、綴ります。</h1>
</header>

<main class="blog-list" id="blogList">
  <p style="color: var(--color-text); font-size: 0.9rem;">読み込み中...</p>
</main>

<footer>
  <div class="footer-logo">ryupro</div>
  <div class="footer-copy">&copy; 2024 ryupro LLC. All Rights Reserved.</div>
</footer>

<script>
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const basePath = isLocal ? '' : '/ryupro';
  fetch(basePath + '/blog/data/posts.json')
    .then(res => res.json())
    .then(posts => {
      const list = document.getElementById('blogList');
      if (!posts.length) {
        list.innerHTML = '<p style="color: var(--color-text); font-size: 0.9rem;">まだ記事がありません。</p>';
        return;
      }
      const defaultImg = basePath + '/assets/images/default-blog.jpg';
      list.innerHTML = posts.map(post => {
        const imgSrc = post.image ? basePath + post.image : defaultImg;
        return `
        <a href="${basePath}/blog/${post.url}" class="blog-card">
          <div class="blog-card-img">
            <img src="${imgSrc}" alt="${post.title}" onerror="this.src='${defaultImg}'">
          </div>
          <div>
            <div class="blog-card-date">${post.date}</div>
            <div class="blog-card-title">${post.title}</div>
            <div class="blog-card-excerpt">${post.excerpt}</div>
          </div>
        </a>`;
      }).join('');
    })
    .catch(() => {
      document.getElementById('blogList').innerHTML = '<p style="color: var(--color-text); font-size: 0.9rem;">記事の読み込みに失敗しました。</p>';
    });
</script>
</body>
</html>
