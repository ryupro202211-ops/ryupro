<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ | 合同会社ryupro</title>
  <meta name="description" content="合同会社ryuproのブログ。イベント情報やコラムをお届けします。">
  <link rel="canonical" href="https://ryupro202211-ops.github.io/ryupro/blog/">
  <meta property="og:type" content="blog">
  <meta property="og:site_name" content="合同会社ryupro">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="ブログ | 合同会社ryupro">
  <meta property="og:description" content="合同会社ryuproのブログ。イベント情報やコラムをお届けします。">
  <meta property="og:url" content="https://ryupro202211-ops.github.io/ryupro/blog/">
  <meta property="og:image" content="https://ryupro202211-ops.github.io/ryupro/assets/images/ogp.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ブログ | 合同会社ryupro">
  <meta name="twitter:description" content="合同会社ryuproのブログ。イベント情報やコラムをお届けします。">
  <meta name="twitter:image" content="https://ryupro202211-ops.github.io/ryupro/assets/images/ogp.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="blog.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/ryupro/" class="nav-logo">ryupro</a>
    <a href="/ryupro/" class="nav-back">&larr; トップに戻る</a>
  </div>
</nav>

<header class="page-header">
  <div class="section-label">ブログ<span class="en">Blog</span></div>
  <h1 class="section-title">日々のこと、綴ります。</h1>
</header>

<main class="blog-list" id="blogList">
  <p style="color: var(--color-text); font-size: 0.9rem;">読み込み中...</p>
</main>

<footer>
  <div class="footer-logo">ryupro</div>
  <div class="footer-copy">&copy; 2024 ryupro LLC. All Rights Reserved.</div>
</footer>

<script>
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const basePath = isLocal ? '' : '/ryupro';
  fetch(basePath + '/blog/data/posts.json')
    .then(res => res.json())
    .then(posts => {
      const list = document.getElementById('blogList');
      if (!posts.length) {
        list.innerHTML = '<p style="color: var(--color-text); font-size: 0.9rem;">まだ記事がありません。</p>';
        return;
      }
      const defaultImg = basePath + '/assets/images/default-blog.jpg';
      list.innerHTML = posts.map(post => {
        const imgSrc = post.image ? basePath + post.image : defaultImg;
        return `
        <a href="${basePath}/blog/${post.url}" class="blog-card">
          <div class="blog-card-img">
            <img src="${imgSrc}" alt="${post.title}" loading="lazy" decoding="async" onerror="this.src='${defaultImg}'">
          </div>
          <div>
            <div class="blog-card-date">${post.date}</div>
            <div class="blog-card-title">${post.title}</div>
            <div class="blog-card-excerpt">${post.excerpt}</div>
          </div>
        </a>`;
      }).join('');
    })
    .catch(() => {
      document.getElementById('blogList').innerHTML = '<p style="color: var(--color-text); font-size: 0.9rem;">記事の読み込みに失敗しました。</p>';
    });
</script>
</body>
</html>
