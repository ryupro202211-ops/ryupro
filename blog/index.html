<head>

    <meta name="description" content="合同会社ryuproのブログ一覧ページです。最新のニュースやコラムをお届けします。">

    <!-- OGP -->
    <meta property="og:title" content="Blog | 合同会社ryupro">
    <meta property="og:type" content="blog">
    <meta property="og:url" content="https://ryupro202211-ops.github.io/ryupro/blog/">
    <meta property="og:image" content="https://ryupro202211-ops.github.io/ryupro/assets/images/ogp.jpg">
    <meta property="og:site_name" content="合同会社ryupro">
    <meta property="og:description" content="合同会社ryuproのブログ一覧ページです。最新のニュースやコラムをお届けします。">

    <link rel="canonical" href="https://ryupro202211-ops.github.io/ryupro/blog/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Lucide Icons (pinned version) -->
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>

<body>
    <!-- Header -->
    <header id="header" class="header">
        <div class="container header-container">
            <a href="../index.html" class="logo">ryupro</a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="../index.html#philosophy">理念</a></li>
                    <li><a href="../index.html#services">事業内容</a></li>
                    <li><a href="../index.html#company">会社概要</a></li>
                    <li><a href="index.html" class="active">ブログ</a></li>
                    <li><a href="../contact/index.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <button class="mobile-menu-btn" aria-label="メニューを開く">
                <i data-lucide="menu"></i>
            </button>
        </div>
        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu">
            <ul class="mobile-nav-list">
                <li><a href="../index.html#philosophy">理念</a></li>
                <li><a href="../index.html#services">事業内容</a></li>
                <li><a href="../index.html#company">会社概要</a></li>
                <li><a href="index.html">ブログ</a></li>
                <li><a href="../contact/index.html">お問い合わせ</a></li>
            </ul>
            <button class="close-menu-btn" aria-label="メニューを閉じる">
                <i data-lucide="x"></i>
            </button>
        </div>
    </header>

    <main>
        <!-- Page Header -->
        <section class="section bg-light blog-page-header">
            <div class="container text-center">
                <h1 class="section-title">Blog</h1>
                <span class="section-subtitle">ブログ・お知らせ</span>
            </div>
        </section>

        <!-- Blog Grid -->
        <section class="section blog-section-body">
            <div class="container">
                <div class="blog-grid" id="blog-grid">
                    <div class="loading-state">
                        <p>Loading articles...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="contact" class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">ryupro</div>
                <p class="footer-message">Creating Professional Value</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; <span class="js-year">2024</span> ryupro LLC. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        lucide.createIcons();
        document.querySelector('.js-year').textContent = new Date().getFullYear();

        async function loadPosts() {
            try {
                let response;
                try {
                    response = await fetch('/api/posts?t=' + Date.now());
                    if (!response.ok) throw new Error('API unavailable');
                } catch (e) {
                    response = await fetch('data/posts.json?t=' + Date.now());
                }

                const posts = await response.json();

                // Sort by date descending
                posts.sort((a, b) => {
                    const dateA = a.date.replace(/\./g, '-');
                    const dateB = b.date.replace(/\./g, '-');
                    return dateB.localeCompare(dateA);
                });

                renderPosts(posts);
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('blog-grid').innerHTML = '<p class="loading-state">記事の読み込みに失敗しました。</p>';
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('blog-grid');
            container.innerHTML = '';

            posts.forEach(post => {
                // Fix image path for GitHub Pages
                let imgPath = post.image;
                if (imgPath.startsWith('/') && !imgPath.startsWith('//')) {
                    imgPath = '..' + imgPath;
                }

                const articleHTML = `
                    <article class="blog-card reveal-up">
                        <a href="${post.url}" class="blog-card-image">
                            <img src="${imgPath}" alt="${post.title}" loading="lazy">
                        </a>
                        <div class="blog-card-content">
                            <div class="blog-date">${post.date}</div>
                            <h2 class="blog-title"><a href="${post.url}">${post.title}</a></h2>
                            <p class="blog-excerpt">${post.excerpt}</p>
                            <a href="${post.url}" class="read-more">Read More <i data-lucide="arrow-right" size="16"></i></a>
                        </div>
                    </article>
                `;
                container.insertAdjacentHTML('beforeend', articleHTML);
            });
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>

</html>
