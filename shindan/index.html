<style>

    display: flex; justify-content: center;
    position: relative; overflow-x: hidden;
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(95px); z-index: 0; }
  .glow.a { top: -80px; left: -60px; width: 260px; height: 260px; background: #e0411f; opacity: .22; animation: glow 4s ease-in-out infinite; }
  .glow.b { bottom: -100px; right: -70px; width: 300px; height: 300px; background: #e6b450; opacity: .18; animation: glow 5s ease-in-out infinite; }
  #wrap { width: 100%; max-width: 440px; padding: 28px 22px 48px; position: relative; z-index: 1; }
  @keyframes rise { from {opacity:0; transform:translateY(16px)} to {opacity:1; transform:none} }
  @keyframes pop { 0%{transform:scale(.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  @keyframes glow { 0%,100%{opacity:.5} 50%{opacity:1} }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes think { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .rise { animation: rise .5s ease both; }
  .display { font-family: 'Dela Gothic One',sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  .opt { width:100%; padding:22px 20px; margin-bottom:16px; border-radius:16px; border:1.5px solid rgba(230,180,80,.35);
         background:#fffdf7; color:#4a3a2c; font-size:17px; font-weight:700; text-align:left;
         transition:all .2s; display:flex; align-items:center; gap:14px; }
  .opt:hover { transform: translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .opt:active { transform: scale(.98); }
  .badge { flex-shrink:0; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
           background:#e6b450; color:#14121f; font-weight:900; font-size:15px; font-family:'Dela Gothic One',sans-serif; }
  .cta { width:100%; padding:18px; border:none; border-radius:16px; color:#fff; font-size:18px; font-weight:900;
         letter-spacing:1px; box-shadow:0 12px 30px rgba(224,65,31,.4); font-family:'Dela Gothic One',sans-serif;
         background:linear-gradient(135deg,#e0411f,#b8330f); }
  .ghost { width:100%; padding:13px; border:none; background:none; color:#8a7a66; font-size:14px; }
  input, textarea { width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid rgba(230,180,80,.3);

  textarea { resize:none; line-height:1.6; }
  ::placeholder { color:#b0a08c; }
  .lbl { font-size:13px; color:#8a7a66; display:block; margin-bottom:8px; font-weight:700; }
  .seg { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:11px 14px; border-radius:11px; border:1.5px solid rgba(230,180,80,.35);
          background:#fffdf7; color:#4a3a2c; font-size:14px; font-weight:700; transition:all .15s; }

  .chip[data-sel="1"] { background:#e6b450; color:#14121f; border-color:#c8922b; }
  .admin { margin-top:26px; font-size:12px; color:#6b6280; text-align:center; line-height:1.8; }
  .admin a { color:#c8922b; text-decoration:underline; cursor:pointer; }
  .koh{position:fixed;top:0;left:0;right:0;height:12px;z-index:6;background:repeating-linear-gradient(90deg,#e0411f 0 22px,#fff 22px 44px);box-shadow:0 1px 5px rgba(0,0,0,.12);}

/* ====== 質問（2択×8＝4軸を各2問で測定） ====== */
/* 並び順: 0-1テンポ / 2-3志向 / 4-5武器 / 6-7舞台 */
const QUESTIONS = [
  {q:"今の働き方を変えるなら、まず…",
   a:{label:"とにかく早く動きたい", v:"Q"},
   b:{label:"しっかり準備してから", v:"P"}},
  {q:"チャンスが目の前に来たら…",
   a:{label:"直感を信じて、まず飛び込む", v:"Q"},
   b:{label:"情報を集めて、慎重に判断する", v:"P"}},
  {q:"新しい仕事に求めるのは…",
   a:{label:"未経験でも大きく変える挑戦", v:"C"},
   b:{label:"今の経験を活かせる安定", v:"K"}},
  {q:"ワクワクするのはどっち？",
   a:{label:"やったことのない世界に飛び込む", v:"C"},
   b:{label:"得意なことを、さらに極める", v:"K"}},
  {q:"あなたの一番の武器は…",
   a:{label:"専門スキル・知識", v:"S"},
   b:{label:"人とのつながり・巻き込み力", v:"H"}},

   a:{label:"「これはあの人に任せれば確実」な専門性", v:"S"},

  {q:"やる気が出るのは…",
   a:{label:"自分の裁量で進められるとき", v:"M"},
   b:{label:"チームや仲間と進めるとき", v:"O"}},

/* ====== プロフィール選択肢 ====== */
const AGE    = ["10代","20代","30代","40代","50代","60代〜"];
const GENDER = ["男性","女性","その他・無回答"];
const YEARS  = ["1年未満","1〜3年","4〜9年","10年以上"];
const JOBS   = ["0回","1回","2回","3回以上"];

/* ====== 状態 ====== */
const state = { step:0, answers:[], type:null,
  name:"", ageRange:"", gender:"", years:"", jobChanges:"", moya:"" };

/* ====== ロジック ====== */
function determineType(ans){
  const v = i => ans[i]===0 ? QUESTIONS[i].a.v : QUESTIONS[i].b.v;
  // 各軸を2問で測定：両方一致なら確定、1対1で割れたら最初の問を優先
  const axis = (i,j,A,B) => {
    let a = 0; if(v(i)===A) a++; if(v(j)===A) a++;
    if(a===2) return A;
    if(a===0) return B;
    return v(i);
  };
  return axis(0,1,"Q","P") + axis(2,3,"C","K") + axis(4,5,"S","H") + axis(6,7,"M","O");
}
const esc = t => (t||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ====== データ保存（実機ブラウザで有効） ====== */
const KEY = "recamp_data";
function recCount(){ try { return JSON.parse(localStorage.getItem(KEY)||"[]").length; } catch(e){ return 0; } }
function buildRecord(){
  return {
    ts: new Date().toLocaleString("ja-JP"),
    name: state.name||"", age: state.ageRange||"", gender: state.gender||"",
    years: state.years||"", jobChanges: state.jobChanges||"",
    type: TYPES[state.type].name,
    typeCode: state.type,
    date: new Date().toLocaleDateString("ja-JP"),
    answers: state.answers.map(a=> a===0?"A":"B").join(""),
    moya: state.moya||"", tablet: TABLET
  };
}
function saveRecord(rec){
  try {
    const arr = JSON.parse(localStorage.getItem(KEY)||"[]");
    arr.push(rec);
    localStorage.setItem(KEY, JSON.stringify(arr));
  } catch(e){ /* 保存不可環境ではスキップ */ }
}
function sendToSheet(rec){
  if(!SHEET_ENDPOINT) return;            // 未設定なら送信しない
  try {
    fetch(SHEET_ENDPOINT, {
      method: "POST",
      mode: "no-cors",                   // GASのCORS問題を回避（送信専用）
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(rec)
    });
  } catch(e){ /* 送信失敗してもローカルCSVに残る */ }
}
function exportCSV(){
  let arr=[]; try { arr = JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){}
  if(!arr.length){ alert("まだ保存された回答がありません。\n（実機でファイルを開いて診断すると保存されます）"); return; }
  const head = ["日時","お名前","年齢層","性別","社会人歴","転職回数","タイプ","回答パターン","モヤモヤ","端末"];
  const rows = arr.map(r=>[r.ts,r.name,r.age,r.gender,r.years,r.jobChanges,r.type,r.answers,r.moya,r.tablet||""]);
  const csv = [head,...rows].map(row=> row.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="recamp_responses_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function clearData(){
  if(confirm("保存した回答をすべて削除します。よろしいですか？")){

  }
}

/* ====== 演出：効果音・紙吹雪・集計・4軸メーター ====== */
let AC = null;
function ensureAudio(){
  try { if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }
  catch(e){ AC=null; }
}
function playFanfare(rare){
  if(!AC) return;
  try {
    const now = AC.currentTime;
    const notes = rare ? [523,659,784,1047,1319] : [523,659,784,1047];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="triangle"; o.frequency.value=f;
      const t0=now+i*0.10;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+0.3);
    });
    // 太鼓ドン（低音ノイズ）
    const dur=0.18, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
    for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=220;
    const bg=AC.createGain(); bg.gain.value=0.5;
    src.connect(lp).connect(bg).connect(AC.destination); src.start(now);
  } catch(e){}
}
function launchConfetti(accent, intense){
  try {
    const cv=document.createElement("canvas");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
    document.body.appendChild(cv);
    const ctx=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight;
    const colors=[accent,"#e6b450","#e0411f","#ffffff","#3a9a5c"], N=intense?180:120, P=[];
    for(let i=0;i<N;i++) P.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,w:6+Math.random()*8,h:8+Math.random()*10,
      c:colors[(Math.random()*colors.length)|0],vx:(Math.random()-0.5)*3,vy:3+Math.random()*4,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4});
    let frames=0;
    (function loop(){
      ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
      if(++frames<160) requestAnimationFrame(loop);
      else { cv.style.transition="opacity .6s"; cv.style.opacity="0"; setTimeout(()=>cv.remove(),700); }
    })();
  } catch(e){}
}
let STATS = { total:0, counts:{}, loaded:false };
function refreshStats(){
  if(!SHEET_ENDPOINT) return;
  try {
    const cb = "__stats_" + Date.now();
    window[cb] = function(data){
      try { if(data && typeof data.total==="number"){ STATS.total=data.total; STATS.counts=data.counts||{}; STATS.loaded=true; } } catch(e){}
      delete window[cb];
      const el=document.getElementById(cb); if(el) el.remove();
    };
    const s=document.createElement("script");
    s.id=cb;
    s.src = SHEET_ENDPOINT + (SHEET_ENDPOINT.indexOf("?")>=0?"&":"?") + "callback=" + cb + "&_=" + Date.now();
    s.onerror=function(){ try{ delete window[cb]; }catch(e){} s.remove(); };
    document.head.appendChild(s);
  } catch(e){}
}
// スプシ集計があれば2台合算の出現率、なければ端末内データで計算
function getStats(code, name){
  if(SHEET_ENDPOINT && STATS.loaded && STATS.total>0){
    const c = STATS.counts[name] || 0;
    return { total: STATS.total, typeCount: c, pct: Math.round(c/STATS.total*1000)/10, src:"sheet" };
  }
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){}
  const total=arr.length, typeCount=arr.filter(r=> r.typeCode===code).length;
  return { total, typeCount, pct: total?Math.round(typeCount/total*1000)/10:0, src:"local" };
}
function axisMeterHTML(accent){
  const v = k => state.answers[k]===0 ? QUESTIONS[k].a.v : QUESTIONS[k].b.v;
  const lean = (i,j,A)=>{ let a=0; if(v(i)===A)a++; if(v(j)===A)a++; return a/2; }; // 0 / .5 / 1
  const tQ=lean(0,1,"Q"), tC=lean(2,3,"C"), tS=lean(4,5,"S"), tM=lean(6,7,"M");
  const poles=[
    {l:"即行動",val:tQ},{l:"挑戦",val:tC},{l:"スキル",val:tS},{l:"自分で",val:tM},
    {l:"計画",val:1-tQ},{l:"堅実",val:1-tC},{l:"人脈",val:1-tS},{l:"組織",val:1-tM}
  ];
  const cx=150, cy=120, R=74, lr=R+22;
  const ang=i=>(-90+i*45)*Math.PI/180;
  const pt=(i,r)=>[(cx+r*Math.cos(ang(i))).toFixed(1),(cy+r*Math.sin(ang(i))).toFixed(1)];
  const ring=r=>poles.map((_,i)=>pt(i,r).join(",")).join(" ");
  const spokes=poles.map((_,i)=>{const p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ddd0b6" stroke-width="1"/>`;}).join("");
  const data=poles.map((p,i)=>pt(i,Math.max(0.07,p.val)*R).join(",")).join(" ");
  const dots=poles.map((p,i)=>{const q=pt(i,Math.max(0.07,p.val)*R);return `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${accent}"/>`;}).join("");
  const labels=poles.map((p,i)=>{const q=pt(i,lr);const c=p.val>0.5?accent:"#b3a99c";return `<text x="${q[0]}" y="${(parseFloat(q[1])+3.5).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" text-anchor="middle">${p.l}</text>`;}).join("");
  return `<div style="margin:2px 0 14px;text-align:center;">
      <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:${accent};margin-bottom:2px;">あなたの傾向（4軸）</div>
      <svg viewBox="0 0 300 240" width="100%" style="max-width:300px;display:block;margin:0 auto;">
        <polygon points="${ring(R)}" fill="none" stroke="#e0d4ba" stroke-width="1"/>
        <polygon points="${ring(R*0.5)}" fill="none" stroke="#e7ddc8" stroke-width="1"/>
        ${spokes}
        <polygon points="${data}" fill="${accent}" fill-opacity="0.22" stroke="${accent}" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>`;
}

function renderResult(view){
  const rec = buildRecord();
  if(!view){ saveRecord(rec); sendToSheet(rec); }  // 閲覧モード（QRから開いた人）では保存・送信しない
  const t = TYPES[state.type];
  const st = getStats(state.type, t.name);
  const rare = st.total >= 20 && st.pct <= 6.25;   // 平均(1/16≒6.25%)以下＝レア
  const sub = `（全${st.total}人中${st.typeCount}人）`;
  const pill = rare
    ? `<span style="display:inline-block;font-size:12.5px;font-weight:900;padding:6px 16px;border-radius:999px;background:${t.accent};color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);">✨ 出現率 ${st.pct}% のレアタイプ！</span>`
    : `<span style="display:inline-block;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.05);color:#6b5f55;">全期間の出現率 ${st.pct}% <span style="font-weight:400;opacity:.7;">${sub}</span></span>`;
  const rarityHTML = `<div style="text-align:center;margin:8px 0 2px;">${pill}</div>`;
  const meterHTML = axisMeterHTML(t.accent);
  // 結果持ち帰り用QR（ブースの結果画面のみ表示）
  let qrHTML = "";
  if(!view){
    try {
      const base = RESULT_BASE_URL || (location.origin + location.pathname);
      const url = base + "?a=" + state.answers.join("") + (state.name ? "&n="+encodeURIComponent(state.name) : "");
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      const durl = qr.createDataURL(5, 2);
      qrHTML = `<div style="margin-top:20px;padding-top:18px;border-top:1px dashed #e0d4ba;text-align:center;">
          <div style="font-size:13px;font-weight:900;color:${t.accent};margin-bottom:8px;">📱 結果をスマホに持ち帰る</div>
          <img src="${durl}" alt="結果QR" style="width:150px;height:150px;image-rendering:pixelated;border:6px solid #fff;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(120,80,40,.15);">
          <div style="font-size:12px;color:#8a7a66;margin-top:8px;line-height:1.6;">QRを読み取ると、あなたの結果が<br>スマホで開きます（保存・シェアOK）</div>
        </div>`;
    } catch(e){ qrHTML = ""; }
  }
  const cleanBase = RESULT_BASE_URL || (location.origin + location.pathname);
  const shareLine = `<p style="text-align:center;color:#8a7a66;font-size:13px;margin:18px 0 4px;">📸 スクショして保存・シェアしてね</p>`;
  const bottomHTML = view
    ? `<a href="${cleanBase}" style="display:block;text-decoration:none;margin-top:8px;border:1.5px solid rgba(224,65,31,.5);border-radius:14px;padding:16px;color:#e0411f;font-size:16px;font-weight:900;background:#fffdf7;text-align:center;">▶ 自分も診断してみる</a>`
    : `<button class="ghost" style="margin-top:8px;border:1.5px solid rgba(230,180,80,.4);border-radius:14px;padding:16px;color:#c8922b;font-size:16px;font-weight:900;background:#fffdf7;" onclick="restart()">もう一度 / 次の人へ</button>`;
  const taiko = (state.name ? state.name+"さん、" : "") + t.taiko;
  const moyaLine = state.moya ? `
    <div style="background:rgba(0,0,0,.04);border-left:3px solid ${t.accent};border-radius:8px;padding:12px 14px;margin:0 0 18px;">
      <div style="font-size:12px;color:#8a7d72;margin-bottom:4px;">あなたのモヤモヤ</div>
      <div style="font-size:14px;color:#3a3247;line-height:1.6;">「${esc(state.moya)}」<br>——だからこそ、この動き方が合います。</div>
    </div>` : "";
  wrap.innerHTML = `
    <div class="rise">
      <div style="border-radius:22px;padding:30px 24px 26px;margin-top:8px;background:linear-gradient(180deg,#ffffff,#fdf4e6);color:#2a2336;box-shadow:0 16px 40px rgba(120,80,40,.22);position:relative;overflow:hidden;">
        <div style="position:absolute;top:0;left:0;right:0;height:6px;background:${t.accent};"></div>
        <div style="text-align:center;font-size:12px;letter-spacing:4px;color:${t.accent};font-weight:900;margin-bottom:4px;">YOUR TYPE</div>
        <div style="text-align:center;font-size:64px;line-height:1;margin:6px 0;animation:pop .6s ease both;">${t.emoji}</div>
        <h2 style="font-family:'Zen Maru Gothic','Noto Sans CJK JP',sans-serif;font-weight:900;text-align:center;font-size:28px;margin:4px 0 2px;color:${t.accent};">${t.name}</h2>
        <div style="text-align:center;font-size:12px;letter-spacing:3px;color:#9b8aa0;font-weight:700;margin-top:2px;">TYPE ${state.type}　（16種）</div>
        ${rarityHTML}
        <p style="text-align:center;font-size:16px;font-weight:700;line-height:1.6;margin:14px 4px 20px;color:#1f1a2b;">「${esc(taiko)}」</p>
        ${moyaLine}
        ${meterHTML}
        <div style="margin-bottom:4px;">
          <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:${t.accent};margin-bottom:6px;">あなたに合う転職の進め方</div>
          <p style="font-size:14.5px;line-height:1.75;margin:0;color:#3a3247;">${t.susumekata}</p>
        </div>
        <div style="background:${t.accent};border-radius:14px;padding:16px 18px;margin:16px 0;color:#fff;">
          <div style="font-size:12px;font-weight:900;letter-spacing:2px;opacity:.9;margin-bottom:6px;">今日からの最初の一歩 👣</div>
          <div style="font-size:16px;font-weight:700;line-height:1.6;">${t.ippo}</div>
        </div>
        <div style="margin-bottom:4px;">
          <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:#9b8aa0;margin-bottom:6px;">やりがちな“地雷”</div>
          <p style="font-size:14.5px;line-height:1.75;margin:0;color:#3a3247;">${t.jirai}</p>
        </div>
        ${qrHTML}
        <div style="margin-top:22px;padding-top:16px;border-top:1px dashed #cdbfa6;text-align:center;">
          <!-- ▼ 当日はここを Re▶CAMPUS のLINE登録QR / 案内 に差し替え ▼ -->
          <div style="font-size:13px;color:#6b5f55;line-height:1.7;">
            こういう“動き方”の人が集まる場所、あるよ。<br>
            <span style="font-weight:900;color:${t.accent};">▶ Re▶CAMPUS のLINEはこちら（QRを設置）</span>
          </div>
        </div>
      </div>
      ${shareLine}
      ${bottomHTML}
    </div>`;
  // 結果発表の演出（紙吹雪＋効果音）
  launchConfetti(t.accent, rare);
  playFanfare(rare);
}

renderIntro();
refreshStats(); // 起動時にスプシ集計を先読み
// QRから開かれた場合：回答(?a=)を復元して結果を直接表示
(function(){
  try {
    const p = new URLSearchParams(location.search);
    const a = p.get("a");
    if(a && /^[01]{8}$/.test(a)){
      state.answers = a.split("").map(Number);
      state.name = p.get("n") || "";
      state.type = determineType(state.answers);
      renderResult(true); // 閲覧モード（保存・送信しない）
    }
  } catch(e){}
})();
</script>
</body>
