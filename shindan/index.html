const TYPES = {
  QCSM: {bunseki:"思い立ったらすぐ動ける行動派。前例のない挑戦にワクワクし、自分の専門スキルを武器に、誰も通っていない道を切り開くタイプです。指示を待つより自分で決めて進めたい気持ちが強く、組織の枠に縛られない働き方が性に合います。決断が速く、周りがためらう場面でも最初の一歩を踏み出せるのが最大の魅力。発信力もあり、気づけば人が後をついてきます。周囲からは「熱量があって頼もしい」「見ているとこちらまで動きたくなる」と映ることが多いでしょう。一方で走り出しの速さゆえ、準備や土台づくりを飛ばしがちな面も。スピードは保ちつつ、時々立ち止まって足場を固めれば、その挑戦はさらに遠くまで届きます。", emoji:"🚀", name:"先駆けパイオニア型", accent:"#e0411f",

    ippo:"自分のスキルで挑戦したい分野を今日1つ決めて、発信してみる。",

  QCSO: {bunseki:"迷う前に動ける、抜群の決断スピードが持ち味。新しい環境や成長企業に飛び込むことを恐れず、自分のスキルを引っさげてどんどん挑戦していくタイプです。一人で抱え込むより、組織やチームの中で力を発揮したい人。エネルギーが高く、停滞した空気を変える起爆剤になれます。条件よりも伸びしろや面白さで進路を選ぶ傾向があり、その嗅覚は鋭い。周囲からは「フットワークが軽くて頼れる」「いるだけで場が前に進む」と見られているはず。ただ勢いで決めて、入社後に思っていたのと違ったとなりやすいのが注意点。一社だけでも深く調べる時間を持てば、その行動力が最高の結果に結びつきます。", emoji:"⚡", name:"稲妻チャレンジャー型", accent:"#e8893a",

    susumekata:"自分のスキルを引っさげ、思い切って異業種や成長企業へ飛び込むのが合います。安定した大企業より、勢いのあるベンチャーや裁量の大きい環境を選ぶと力を発揮できます。求人は条件より“伸びしろ”や面白さで選ぶのが当たり。気になる会社が見つかったら、迷う前にまず応募し、面接で直接温度感を確かめにいきましょう。",

    hikaku:"歴史でたとえるなら織田信長タイプ。石橋を叩く前に、もう渡っている決断の速さ。"},
  QCHM: {bunseki:"人を巻き込み、ゼロから何かを起こせるエネルギーの持ち主。アイデアが浮かんだらすぐ動き、周りに声をかけて仲間を集めるのが得意なタイプです。スキルより人とのつながりが武器で、誰かと一緒に新しい挑戦を形にする時に最も輝きます。組織に属するより、自分の旗を立てて動きたい独立志向の人。明るく前向きで、その熱量が自然と人を惹きつけ、気づけば中心に人が集まっています。周囲からは「一緒に何かやりたくなる人」と思われているでしょう。一方、勢いだけで広げてしまい、お金や計画など足元の管理が後回しになりがち。冷静に支えてくれる相棒や仕組みを持てば、あなたの構想は一気に現実になります。", emoji:"🦁", name:"巻き込み起業家型", accent:"#d4762b",

  QCHO: {bunseki:"チャンスの波が来たら迷わず乗れる、直感とフットワークの人。新しいことが好きで、人との縁をきっかけに面白い世界へ飛び込んでいくタイプです。自分一人でというより、信頼できる仲間や組織の中で力を発揮したい人。場の空気を読み、人をつなぐのが自然と上手く、どこへ行っても可愛がられます。面白そうな人がいる場所へ動く嗅覚は抜群で、思わぬ好機を次々つかみます。周囲からは「運とご縁を引き寄せる人」に見えているはず。ただ、ノリで決めて後から条件面で後悔することも。ワクワクは大事にしつつ、最低限の確認だけは忘れないようにすると、ご縁がより良い形で実っていきます。", emoji:"🐬", name:"縁つかみダイバー型", accent:"#2fa3c0",

  QKSM: {bunseki:"確かな腕を持ち、決めたら素早く動ける職人肌。派手な挑戦より、自分の得意分野を堅実に深めるタイプで、その専門性は十分に通用するレベルです。組織に頼らず、自分の看板で勝負したい独立志向の持ち主。一度やると決めれば行動は速く、無駄なく結果を出せます。地に足のついた現実感覚があり、危ない橋はあまり渡りません。周囲からは「この人に任せれば確実」と信頼され、頼られる場面が多いでしょう。一方で、もう少し腕を磨いてからと、踏み出しを先延ばしにする慎重さも。あなたの実力はすでに十分。小さく副業から始めるなど、一歩を出すきっかけさえあれば、一気に独り立ちできます。", emoji:"🛠", name:"早撃ち職人型", accent:"#b5862f",

  QKSO: {bunseki:"培ったスキルですぐ戦力になれる、頼れる即戦力タイプ。大きく冒険するより、自分の得意を活かせる場所で堅実に力を発揮する人です。組織の中でこそ輝くチームプレイヤーで、動くと決めたら素早く環境を切り替えられます。地に足のついた判断ができ、現実的なゴールを着実に達成していきます。周囲からは「安定感があって任せやすい」と評価され、どんな職場でも早くなじめるでしょう。同業や近い職種なら、短期間で次の場所が決まるはず。ただ、早く決めたい気持ちが先に立って、年収や役割の交渉を省きがちなのが惜しい点。自分の市場価値を一度きちんと確かめてから動けば、納得の好条件を引き寄せられます。", emoji:"📈", name:"即戦力スイッチ型", accent:"#5a8f3a",
    taiko:"あなたはすぐ戦力になれる。動けば結果はついてくる。",
    susumekata:"培ったスキルを活かせる組織へ、堅実かつスピーディに移るのが王道です。同業や近い職種なら、これまでの実績がそのまま評価され、短期間で次が決まります。まずは今の経験で評価される求人を数件見比べ、条件のいいものから動きましょう。早く決めたい時こそ、年収や役割の交渉だけは省かず、きちんと提示するのが得策です。",
    ippo:"今の経験で評価される求人を今日3件、条件を見比べる。",
    jirai:"早く決めたい気持ちで、年収や役割の交渉を省いてしまうこと。",
    hikaku:"歴史でたとえるなら黒田官兵衛タイプ。どの陣営でもすぐ頭角を現す、頼れる参謀肌。"},
  QKHM: {bunseki:"あなたの周りには、もう次のチャンスが揃っている人望家。派手さより堅実さを好み、人脈を頼りに自分の道を歩んでいくタイプです。スキル単体より、信頼できる人とのつながりが最大の資産で、知人経由の仕事から無理なく独立へ進めます。決断は意外と早く、良い話が来たらすっと動ける軽やかさも。穏やかで誠実な人柄が、自然と人を引き寄せます。周囲からは「あの人になら頼みたい」と思われ、声がかかりやすいでしょう。ただ、仲のいい相手だからと遠慮して、条件や約束をなあなあにしてしまいがち。親しい間柄でも最低限の取り決めをきちんとしておくことが、長く良い関係を続ける秘訣です。", emoji:"🦊", name:"つて頼り独立型", accent:"#c77f4a",
    taiko:"あなたの周りには、もう次のチャンスが揃っている。",
    susumekata:"人脈を頼りに、堅実に独立・個人で動くのが合います。いきなり大勝負を仕掛けるより、知人経由の仕事から少しずつ始めると安全です。まずは信頼できる人に「個人でも仕事を受けられる」と伝え、小さな依頼を積み重ねましょう。親しい相手でも、金額や納期などの条件はきちんと取り決めておくと、長く良い関係が続きます。",
    ippo:"信頼できる人に「個人でも仕事を受けられるよ」と今日伝えてみる。",
    jirai:"仲のいい相手に頼りすぎて、条件をなあなあにしてしまうこと。",
    hikaku:"歴史でたとえるなら渋沢栄一タイプ。人とのつながりを元手に、自分の道を築いていく。"},
  QKHO: {bunseki:"信頼が次のステージへ運んでくれる、人とのつながりを大切にするタイプ。冒険より安定を好み、紹介やリファラルで堅実に新しい場所へ移っていく人です。組織やチームの中で力を発揮し、周りとの信頼関係づくりが抜群に上手い。転職を考えていると早めに周りへ伝えるほど、良い話が舞い込みます。決断は早く、信頼できる相手の紹介なら迷わず動けます。周囲からは「誠実で安心できる人」と見られ、自然と紹介が集まるでしょう。一方、紹介だからと遠慮して、自分の希望条件をはっきり言えないことも。あなたを応援したい人は多いはず。遠慮せず本音を伝えれば、もっと理想に近い場所が見つかります。", emoji:"🐕", name:"信頼でつなぐ即決型", accent:"#b56a55",
    taiko:"信頼が、あなたを次のステージへ運んでくれる。",
    susumekata:"紹介・リファラルでの堅実な転職が最短ルートです。“転職を考えている”と早めに周りへ伝えるほど、信頼できる人から良い話が舞い込みます。まずは信頼できる一人に相談し、合いそうな職場を紹介してもらいましょう。紹介だからと遠慮せず、希望する条件や働き方はきちんと伝えると、後悔のない選択につながります。",
    ippo:"信頼できる人1人に、今日「転職、考えてる」と伝えてみる。",
    jirai:"紹介だからと遠慮して、希望条件をちゃんと言えないこと。",
    hikaku:"歴史でたとえるなら西郷隆盛タイプ。厚い人望が、次のチャンスを自然と運んでくる。"},
  PCSM: {bunseki:"跳ぶ前に、ちゃんと翼を作れる戦略家。挑戦心は強いけれど勢い任せにはせず、しっかり準備してから大胆に動くタイプです。自分のスキルを軸に独立する道が似合い、収入の柱を作ってから飛ぶので、挑戦が無謀になりません。一人で構想を練り、自分の裁量で進めることに喜びを感じる人。先を見通す力と実行力を併せ持ち、周囲からは「考えが深くて頼れる」「計画が現実的だ」と一目置かれるでしょう。ただし準備が完璧主義に傾くと、いつまでも跳べなくなるのが弱点。ここまで整ったら動くという期限をあらかじめ決めておくと、入念な準備を活かして、最高のタイミングで飛び立てます。", emoji:"🦅", name:"設計派フリーランス型", accent:"#5b6ee0",
    taiko:"あなたは、跳ぶ前にちゃんと翼を作れる人だ。",
    susumekata:"じっくり準備して、大胆にスキルで独立する道が向いています。勢いで飛ぶのではなく、独立後の収入の柱になる案件やスキルを先に確保してから動くと、挑戦が無謀になりません。まずは収入源になりそうなスキルを書き出し、副業で試運転を。完璧主義になりがちなので、“ここまで整えたら動く”期限も決めておきましょう。",
    ippo:"独立後の収入源になりそうなスキル・案件を今日1つ書き出す。",
    jirai:"準備が完璧主義になって、いつまでも跳べないこと。期限を決めよう。",
    hikaku:"歴史でたとえるなら伊能忠敬タイプ。長い準備を経てから、大きな挑戦に踏み出す晩成型。"},
  PCSO: {bunseki:"狙った的を、計画どおりに射抜ける戦略家。挑戦を恐れない一方で、しっかり逆算して動く慎重さも併せ持つタイプです。自分のスキルを軸に、計画的な異業種転職で大きく舵を切れる人。組織の中で力を発揮し、目標から逆算してスキルの穴を埋めるので、未経験の領域でも着実に通っていきます。分析力と行動計画の精度はピカイチで、感情より論理で進路を選べる強さがあります。周囲からは「戦略家」「この人の計画なら間違いない」と頼られるでしょう。ただ、考えすぎて応募のタイミングを逃すことも。完璧な分析より、七割見えたら動くくらいの構えでいると、その緻密さが最大の武器になります。", emoji:"🎯", name:"戦略的キャリアチェンジ型", accent:"#4e63c8",
    taiko:"あなたは、狙った的を計画どおりに射抜ける人だ。",
    susumekata:"計画的に、スキルを軸とした大胆な異業種転職が合います。行きたい業界で求められる力を調べ、足りないスキルを逆算して埋めれば、未経験でも着実に通ります。まずは目標の業界・職種を一つ定め、必要なスキルと学ぶ順番を計画化しましょう。分析しすぎて応募が遅れがちなので、“七割見えたら動く”を合言葉に。",
    ippo:"行きたい業界で求められるスキルを今日1つ調べ、学ぶ計画を立てる。",
    jirai:"分析しすぎて、応募のタイミングを逃すこと。",
    hikaku:"歴史でたとえるなら徳川家康タイプ。逆算と我慢で、狙った場所に着実にたどり着く。"},
  PCHM: {bunseki:"人とのつながりから、じっくり未来を作っていくタイプ。挑戦したい気持ちを持ちながら、時間をかけて人脈を育て、独立や起業へつなげていく長期戦の人です。スキル単体より、応援される関係を積み上げることが資産になります。自分の旗を立てたい独立志向で、焦らず布石を打てる計画性が強み。誠実に信頼を重ねるので、いざという時に力を貸してくれる仲間が多く、周囲からは「縁を大切にする人」と慕われるでしょう。ただ、準備と人付き合いに時間をかけすぎて、肝心の一歩が遅れがちな面も。いつ動くかの期限を決めて種をまけば、育てたご縁が大きな実りになって返ってきます。", emoji:"🕸", name:"縁を編む起業準備型", accent:"#8a6fd1",
    taiko:"あなたは、人とのつながりから未来を作れる人だ。",

    ippo:"将来一緒にやりたい人と、今日ひとつ接点を持つ。",

    hikaku:"歴史でたとえるなら岩崎弥太郎タイプ。人脈をじっくり編みながら、自分の事業を育てる。"},
  PCHO: {bunseki:"味方を作ってから道を切り開く、根回し上手な戦略家。挑戦的な環境に飛び込みたい一方、計画的に人脈を使って足場を固めるタイプです。組織の中で力を発揮し、いきなり動くより中の人に話を聞いてから進むので、ミスマッチがほとんど起きません。人間関係の機微を読むのが得意で、敵を作らず物事を前に進められます。慎重さと挑戦心のバランスが絶妙で、周囲からは「調整が上手い」「安心して任せられる」と評価されるでしょう。ただ、根回しに丁寧になりすぎて、肝心の一歩が遅れることも。情報が十分集まったと感じたら、思い切って踏み込む勇気を持つと、準備が確かな成果に変わります。", emoji:"🧭", name:"根回し開拓型", accent:"#7a5fc0",

  PKSM: {bunseki:"焦らず、確実に独り立ちできる慎重派。大きな冒険より、自分のスキルを堅実に育て、少しずつ自分の道へ進んでいくタイプです。組織に依存せず自律して働きたい気持ちが強く、副業で実績と収入を作ってから本移行するので、まず失敗しません。地道な努力を続けられる粘り強さと、現実的な計画力が持ち味。リスクを冷静に見極められる賢さがあり、周囲からは「堅実で信頼できる」と見られるでしょう。一方で、安全を優先しすぎて、いつまでも準備中のまま終わってしまうのが弱点。小さくてもいいので一度実際に動いてみると、自信がつき、独立への助走がぐっと加速していきます。", emoji:"🌿", name:"助走ひとり立ち型", accent:"#3a9a5c",

  PKSO: {bunseki:"着実に積み上げる力が最大の強み、王道タイプ。派手な冒険はせず、自分のスキルを軸に計画的にキャリアアップしていく堅実な人です。組織の中で力を発揮し、資格や実績で足場を固めてから、より良い場所へ一段ずつ上がっていきます。計画性と継続力があり、約束を守る誠実さで周囲の信頼も厚い。長期的な視点でキャリアを設計でき、周りからは「真面目で安定感がある」と一目置かれるでしょう。ただ、準備を重ねるうちに動くタイミングを逃しがちな面も。この実績がついたら動くと期限を決めておくと、せっかくの好機を逃さず、理想のステップアップを実現できます。", emoji:"🪜", name:"王道ステップアップ型", accent:"#c8922b",

  PKHM: {bunseki:"ご縁を、時間をかけるほど強くしていくタイプ。焦って動くより、信頼の貯金をじっくり増やし、将来の独立や自分の道につなげていく人です。スキル以上に人とのつながりが資産で、穏やかに関係を温めるのが得意。自律して働きたい気持ちを持ちつつ、堅実に布石を打てる計画性があります。誠実で聞き上手なので、人から自然と信頼され、相談を持ちかけられることも多いでしょう。周囲からは「そばにいると安心する人」と思われているはず。ただ、縁を温めることに満足して、踏み出す機会を自分で作らないのが惜しい点。育てた信頼にお願いを一つ添えれば、温めたご縁が次の扉を開いてくれます。", emoji:"🌾", name:"ご縁熟成型", accent:"#8f9a3a",

    ippo:"久しく連絡していない信頼できる人に、今日ひとこと連絡する。",

    hikaku:"歴史でたとえるなら良寛タイプ。急がず人との縁を温め、じんわり信頼を育てていく。"},
  PKHO: {bunseki:"信頼できる場所でこそ、力を発揮できる安心重視タイプ。冒険より安定を好み、人の縁を頼りに計画的に動いていく人です。組織やチームの中で持ち味が出て、紹介ベースなら入る前に内情が分かるので、後悔のない選択ができます。和を大切にし、周りと協力して着実に物事を進められるのが強み。誠実で穏やかな人柄が、長く続く信頼関係を生み、周囲からは「一緒にいて落ち着く」「場を和ませる人」と慕われるでしょう。一方、安心を求めるあまり、新しい一歩や変化に二の足を踏みがちな面も。信頼できる人にどんな職場が合うか相談することから始めれば、安心と納得を両立した転職ができます。", emoji:"🧶", name:"安心つながり型", accent:"#b07a92",

/* ====== ロジック ====== */
function determineType(ans){
  const g = QUESTIONS[4].opts[ans[4]].g;                  // 最後の1問＝全体の傾向ナッジ
  const decide = i => { const Q=QUESTIONS[i]; return (Q.opts[ans[i]].val + g) >= 0 ? Q.axisA : Q.axisB; };
  return decide(0) + decide(1) + decide(2) + decide(3);   // 軸順: テンポ/志向/武器/舞台
}
const esc = t => (t||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 性格分析を2文ごとに改行して読みやすく
function fmtBunseki(text){
  const parts = (text||"").split("。").filter(s=>s.length);
  let out="", cnt=0;
  for(let i=0;i<parts.length;i++){
    out += parts[i] + "。";
    cnt++;
    if(cnt>=2 && i < parts.length-1){ out += "<br><br>"; cnt=0; }
  }
  return out;
}
// 進め方：文を3グループに分けて改行を2つ入れる（行間あき）
function fmt3(text){
  const parts = (text||"").split("。").filter(s=>s.length).map(s=>s+"。");
  const n = parts.length;
  if(n<3) return parts.join("");
  const base = Math.floor(n/3), rem = n%3;
  const sizes = [base+(rem>0?1:0), base+(rem>1?1:0), base];
  let out=[], idx=0;
  for(const sz of sizes){ out.push(parts.slice(idx, idx+sz).join("")); idx+=sz; }
  return out.join("<br><br>");
}

/* ====== 演出：効果音・紙吹雪・集計・4軸メーター ====== */
let AC = null;
function ensureAudio(){
  try { if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }
  catch(e){ AC=null; }
}
function playFanfare(tier){
  if(!AC) return;
  try {
    const now = AC.currentTime;
    // レア度が上がるほど音階が長く、高く駆け上がる
    const notesByTier = {
      SSR: [523,659,784,1047,1319,1568,2093],
      SR:  [523,659,784,1047,1319],
      R:   [523,659,784,1047],
      N:   [523,659,784]
    };
    const notes = notesByTier[tier] || notesByTier.N;
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="triangle"; o.frequency.value=f;
      const t0=now+i*0.10;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+0.3);
    });
    // 太鼓ドン（低音ノイズ）
    const dur=0.18, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
    for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=220;
    const bg=AC.createGain(); bg.gain.value=0.5;
    src.connect(lp).connect(bg).connect(AC.destination); src.start(now);
    // SSR限定：キラキラした特別なベル音を追加で重ねる
    if(tier==="SSR"){
      [1568,2093,2637].forEach((f,i)=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.type="sine"; o.frequency.value=f;
        const t0=now+0.55+i*0.09;
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.42);
        o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+0.44);
      });
    }
  } catch(e){}
}
function launchConfetti(accent, tier){
  try {
    const cv=document.createElement("canvas");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
    document.body.appendChild(cv);
    const ctx=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight;
    // SSRだけ金色メインのゴージャスな紙吹雪、それ以外はアクセントカラー中心
    const goldColors=["#ffd700","#fff3c0","#e8b93a","#ffffff","#ffbf00"];
    const normalColors=[accent,"#e6b450","#e0411f","#ffffff","#3a9a5c"];
    const colors = (tier==="SSR") ? goldColors : normalColors;
    const countByTier = {SSR:220, SR:160, R:130, N:100};
    const framesByTier = {SSR:220, SR:170, R:150, N:140};
    const N = countByTier[tier] || 120;
    const maxFrames = framesByTier[tier] || 160;
    const P=[];
    for(let i=0;i<N;i++) P.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,w:6+Math.random()*8,h:8+Math.random()*10,
      c:colors[(Math.random()*colors.length)|0],vx:(Math.random()-0.5)*3,vy:3+Math.random()*4,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4});
    let frames=0;
    (function loop(){
      ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
      if(++frames<maxFrames) requestAnimationFrame(loop);
      else { cv.style.transition="opacity .6s"; cv.style.opacity="0"; setTimeout(()=>cv.remove(),700); }
    })();
  } catch(e){}
}

function getRarityTier(pct, total){

  if(pct <= 6.25) return "SR";   // 平均以下＝レア

function axisMeterHTML(accent){

  const poles=[
    {l:"即行動",val:tQ},{l:"挑戦",val:tC},{l:"スキル",val:tS},{l:"自分で",val:tM},

  const pt=(i,r)=>[(cx+r*Math.cos(ang(i))).toFixed(1),(cy+r*Math.sin(ang(i))).toFixed(1)];
  const ring=r=>poles.map((_,i)=>pt(i,r).join(",")).join(" ");
  const spokes=poles.map((_,i)=>{const p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ddd0b6" stroke-width="1"/>`;}).join("");
  const data=poles.map((p,i)=>pt(i,Math.max(0.07,p.val)*R).join(",")).join(" ");
  const dots=poles.map((p,i)=>{const q=pt(i,Math.max(0.07,p.val)*R);return `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${accent}"/>`;}).join("");
  const labels=poles.map((p,i)=>{const q=pt(i,lr);const c=p.val>0.5?accent:"#b0a8b0";return `<text x="${q[0]}" y="${(parseFloat(q[1])+3.5).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" text-anchor="middle">${p.l}</text>`;}).join("");
  return `<div style="margin:2px 0 14px;text-align:center;">
      <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:${accent};margin-bottom:2px;">あなたの傾向（4軸）</div>
      <svg viewBox="0 0 300 240" width="100%" style="max-width:300px;display:block;margin:0 auto;">
        <polygon points="${ring(R)}" fill="none" stroke="rgba(236,72,153,.18)" stroke-width="1"/>
        <polygon points="${ring(R*0.5)}" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
        ${spokes}
        <polygon points="${data}" fill="${accent}" fill-opacity="0.22" stroke="${accent}" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>`;
}

/* QRから開いた閲覧者向け：結果が読めないときの案内（スタート画面には飛ばさない） */
function renderViewerNotice(){
  wrap.innerHTML = `<div class="rise" style="margin-top:16vh;text-align:center;">
    <div style="font-size:15px;letter-spacing:2px;color:#e84a8c;margin-bottom:14px;font-weight:700;">Re▶CAMPUS</div>
    <div style="font-size:50px;margin-bottom:10px;">✨</div>
    <h2 style="font-family:'Zen Maru Gothic','Noto Sans CJK JP',sans-serif;font-weight:900;font-size:22px;color:#e84a8c;line-height:1.5;margin:0 0 12px;">転職タイプ診断</h2>
    <p style="color:#8a8a96;font-size:14px;line-height:1.9;">この画面は、QRから結果を見るための<br>ページです。<br>診断は会場のブースでどうぞ！</p>
  </div>`;
}

refreshStats(); // 起動時にスプシ集計を先読み
// 起動時の振り分け：QR経由（=閲覧者）はスタート画面に飛ばさない
(function(){
  let a=null, n=null;
  try { const p=new URLSearchParams(location.search); a=p.get("a"); n=p.get("n"); } catch(e){}
  let sa=null, sn=null;
  try { sa=sessionStorage.getItem("va"); sn=sessionStorage.getItem("vn"); } catch(e){}
  let viewer=false, ans=null, nm="";
  if(a!==null){                           // QRから来た（aパラメータあり）→ 閲覧者
    viewer=true;
    if(/^[0-2]{5}$/.test(a)){ ans=a; nm=n||""; try{ sessionStorage.setItem("va",a); sessionStorage.setItem("vn",nm); }catch(e){} }
    else if(sa && /^[0-2]{5}$/.test(sa)){ ans=sa; nm=sn||""; }   // 壊れたら直前の結果を復元
  } else if(sa && /^[0-2]{5}$/.test(sa)){   // 以前QRで開いた端末（URLを丸ごと消した等）
    viewer=true; ans=sa; nm=sn||"";
  }
  const isResultPage = location.pathname.indexOf("shindan_result") >= 0;
  if(viewer){
    if(ans){
      state.answers=ans.split("").map(Number);
      state.name=nm;
      state.type=determineType(state.answers);
      renderResult(true);                  // 閲覧モード（保存・送信しない）
    } else {
      renderViewerNotice();                // 結果が復元できないときも、スタートには戻さない
    }
  } else if(isResultPage){
    renderViewerNotice();                  // 結果専用ページに直接来た（aなし）→ スタートは出さない
  } else {
    renderIntro();                         // ブース（通常フロー）
  }
})();
</script>
