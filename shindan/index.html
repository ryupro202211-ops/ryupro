  QCSM: {bunseki:"思い立ったらすぐ動ける行動派。前例のない挑戦にワクワクし、自分の専門スキルを武器に、誰も通っていない道を切り開くタイプです。指示を待つより自分で決めて進めたい気持ちが強く、組織の枠に縛られない働き方が性に合います。決断が速く、周りがためらう場面でも最初の一歩を踏み出せるのが最大の魅力。発信力もあり、気づけば人が後をついてきます。周囲からは「熱量があって頼もしい」「見ているとこちらまで動きたくなる」と映ることが多いでしょう。一方で走り出しの速さゆえ、準備や土台づくりを飛ばしがちな面も。スピードは保ちつつ、時々立ち止まって足場を固めれば、その挑戦はさらに遠くまで届きます。", emoji:"🚀", name:"先駆けパイオニア型", accent:"#e0411f",

    ippo:"自分のスキルで挑戦したい分野を今日1つ決めて、発信してみる。",
    jirai:"走り出しが速すぎて、土台づくりを飛ばしてしまうこと。"},
  QCSO: {bunseki:"迷う前に動ける、抜群の決断スピードが持ち味。新しい環境や成長企業に飛び込むことを恐れず、自分のスキルを引っさげてどんどん挑戦していくタイプです。一人で抱え込むより、組織やチームの中で力を発揮したい人。エネルギーが高く、停滞した空気を変える起爆剤になれます。条件よりも伸びしろや面白さで進路を選ぶ傾向があり、その嗅覚は鋭い。周囲からは「フットワークが軽くて頼れる」「いるだけで場が前に進む」と見られているはず。ただ勢いで決めて、入社後に思っていたのと違ったとなりやすいのが注意点。一社だけでも深く調べる時間を持てば、その行動力が最高の結果に結びつきます。", emoji:"⚡", name:"稲妻チャレンジャー型", accent:"#e8893a",

    jirai:"勢いで決めて入社後に「思ってたのと違う」となること。1社は深掘りを。"},
  QCHM: {bunseki:"人を巻き込み、ゼロから何かを起こせるエネルギーの持ち主。アイデアが浮かんだらすぐ動き、周りに声をかけて仲間を集めるのが得意なタイプです。スキルより人とのつながりが武器で、誰かと一緒に新しい挑戦を形にする時に最も輝きます。組織に属するより、自分の旗を立てて動きたい独立志向の人。明るく前向きで、その熱量が自然と人を惹きつけ、気づけば中心に人が集まっています。周囲からは「一緒に何かやりたくなる人」と思われているでしょう。一方、勢いだけで広げてしまい、お金や計画など足元の管理が後回しになりがち。冷静に支えてくれる相棒や仕組みを持てば、あなたの構想は一気に現実になります。", emoji:"🦁", name:"巻き込み起業家型", accent:"#d4762b",

  QCHO: {bunseki:"チャンスの波が来たら迷わず乗れる、直感とフットワークの人。新しいことが好きで、人との縁をきっかけに面白い世界へ飛び込んでいくタイプです。自分一人でというより、信頼できる仲間や組織の中で力を発揮したい人。場の空気を読み、人をつなぐのが自然と上手く、どこへ行っても可愛がられます。面白そうな人がいる場所へ動く嗅覚は抜群で、思わぬ好機を次々つかみます。周囲からは「運とご縁を引き寄せる人」に見えているはず。ただ、ノリで決めて後から条件面で後悔することも。ワクワクは大事にしつつ、最低限の確認だけは忘れないようにすると、ご縁がより良い形で実っていきます。", emoji:"🐬", name:"縁つかみダイバー型", accent:"#2fa3c0",

    ippo:"気になる会社で働く知り合いに、今日連絡を取ってみる。",
    jirai:"ノリで決めて、後から条件面で後悔すること。最低限の確認は忘れずに。"},
  QKSM: {bunseki:"確かな腕を持ち、決めたら素早く動ける職人肌。派手な挑戦より、自分の得意分野を堅実に深めるタイプで、その専門性は十分に通用するレベルです。組織に頼らず、自分の看板で勝負したい独立志向の持ち主。一度やると決めれば行動は速く、無駄なく結果を出せます。地に足のついた現実感覚があり、危ない橋はあまり渡りません。周囲からは「この人に任せれば確実」と信頼され、頼られる場面が多いでしょう。一方で、もう少し腕を磨いてからと、踏み出しを先延ばしにする慎重さも。あなたの実力はすでに十分。小さく副業から始めるなど、一歩を出すきっかけさえあれば、一気に独り立ちできます。", emoji:"🛠", name:"早撃ち職人型", accent:"#b5862f",

    ippo:"自分のスキルで個人で受けられる仕事を今日1つリスト化する。",
    jirai:"「まだ早い」と腕を磨き続けて、踏み出しを先延ばしにすること。"},
  QKSO: {bunseki:"培ったスキルですぐ戦力になれる、頼れる即戦力タイプ。大きく冒険するより、自分の得意を活かせる場所で堅実に力を発揮する人です。組織の中でこそ輝くチームプレイヤーで、動くと決めたら素早く環境を切り替えられます。地に足のついた判断ができ、現実的なゴールを着実に達成していきます。周囲からは「安定感があって任せやすい」と評価され、どんな職場でも早くなじめるでしょう。同業や近い職種なら、短期間で次の場所が決まるはず。ただ、早く決めたい気持ちが先に立って、年収や役割の交渉を省きがちなのが惜しい点。自分の市場価値を一度きちんと確かめてから動けば、納得の好条件を引き寄せられます。", emoji:"📈", name:"即戦力スイッチ型", accent:"#5a8f3a",

/* ====== ロジック ====== */
function determineType(ans){
  const g = QUESTIONS[4].opts[ans[4]].g;                  // 最後の1問＝全体の傾向ナッジ
  const decide = i => { const Q=QUESTIONS[i]; return (Q.opts[ans[i]].val + g) >= 0 ? Q.axisA : Q.axisB; };
  return decide(0) + decide(1) + decide(2) + decide(3);   // 軸順: テンポ/志向/武器/舞台
}
const esc = t => (t||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 性格分析を2文ごとに改行して読みやすく
function fmtBunseki(text){
  const parts = (text||"").split("。").filter(s=>s.length);
  let out="", cnt=0;
  for(let i=0;i<parts.length;i++){
    out += parts[i] + "。";
    cnt++;
    if(cnt>=2 && i < parts.length-1){ out += "<br><br>"; cnt=0; }
  }
  return out;
}
// 進め方：文を3グループに分けて改行を2つ入れる（行間あき）
function fmt3(text){
  const parts = (text||"").split("。").filter(s=>s.length).map(s=>s+"。");
  const n = parts.length;
  if(n<3) return parts.join("");
  const base = Math.floor(n/3), rem = n%3;
  const sizes = [base+(rem>0?1:0), base+(rem>1?1:0), base];
  let out=[], idx=0;
  for(const sz of sizes){ out.push(parts.slice(idx, idx+sz).join("")); idx+=sz; }
  return out.join("<br><br>");
}

const KEY = "recamp_data";
function recCount(){ try { return JSON.parse(localStorage.getItem(KEY)||"[]").length; } catch(e){ return 0; } }
function buildRecord(){
  return {
    ts: new Date().toLocaleString("ja-JP"),
    name: state.name||"", age: state.ageRange||"", gender: state.gender||"",
    years: state.years||"", jobChanges: state.jobChanges||"",
    type: TYPES[state.type].name,
    typeCode: state.type,
    date: new Date().toLocaleDateString("ja-JP"),
    answers: state.answers.map(a=> ["A","B","C"][a]).join(""),
    moya: state.moya||"", tablet: TABLET
  };
}
function saveRecord(rec){
  try {
    const arr = JSON.parse(localStorage.getItem(KEY)||"[]");
    arr.push(rec);
    localStorage.setItem(KEY, JSON.stringify(arr));
  } catch(e){ /* 保存不可環境ではスキップ */ }
}

function exportCSV(){

  const rows = arr.map(r=>[r.ts,r.name,r.age,r.gender,r.years,r.jobChanges,r.type,r.answers,r.moya,r.tablet||""]);
  const csv = [head,...rows].map(row=> row.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});

  a.href=url; a.download="recamp_responses_"+new Date().toISOString().slice(0,10)+".csv";

/* ====== 演出：効果音・紙吹雪・集計・4軸メーター ====== */
let AC = null;
function ensureAudio(){
  try { if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }
  catch(e){ AC=null; }
}
function playFanfare(rare){
  if(!AC) return;
  try {
    const now = AC.currentTime;
    const notes = rare ? [523,659,784,1047,1319] : [523,659,784,1047];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="triangle"; o.frequency.value=f;
      const t0=now+i*0.10;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+0.3);
    });
    // 太鼓ドン（低音ノイズ）
    const dur=0.18, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
    for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=220;
    const bg=AC.createGain(); bg.gain.value=0.5;
    src.connect(lp).connect(bg).connect(AC.destination); src.start(now);
  } catch(e){}
}
function launchConfetti(accent, intense){
  try {
    const cv=document.createElement("canvas");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
    document.body.appendChild(cv);
    const ctx=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight;
    const colors=[accent,"#e6b450","#e0411f","#ffffff","#3a9a5c"], N=intense?180:120, P=[];
    for(let i=0;i<N;i++) P.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,w:6+Math.random()*8,h:8+Math.random()*10,
      c:colors[(Math.random()*colors.length)|0],vx:(Math.random()-0.5)*3,vy:3+Math.random()*4,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4});
    let frames=0;
    (function loop(){
      ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
      if(++frames<160) requestAnimationFrame(loop);
      else { cv.style.transition="opacity .6s"; cv.style.opacity="0"; setTimeout(()=>cv.remove(),700); }
    })();
  } catch(e){}
}
let STATS = { total:0, counts:{}, loaded:false };
function refreshStats(){
  if(!SHEET_ENDPOINT) return;
  try {
    const cb = "__stats_" + Date.now();
    window[cb] = function(data){
      try { if(data && typeof data.total==="number"){ STATS.total=data.total; STATS.counts=data.counts||{}; STATS.loaded=true; } } catch(e){}
      delete window[cb];
      const el=document.getElementById(cb); if(el) el.remove();
    };
    const s=document.createElement("script");
    s.id=cb;
    s.src = SHEET_ENDPOINT + (SHEET_ENDPOINT.indexOf("?")>=0?"&":"?") + "callback=" + cb + "&_=" + Date.now();
    s.onerror=function(){ try{ delete window[cb]; }catch(e){} s.remove(); };
    document.head.appendChild(s);
  } catch(e){}
}
// スプシ集計があれば2台合算の出現率、なければ端末内データで計算
function getStats(code, name){
  if(SHEET_ENDPOINT && STATS.loaded && STATS.total>0){
    const c = STATS.counts[name] || 0;
    return { total: STATS.total, typeCount: c, pct: Math.round(c/STATS.total*1000)/10, src:"sheet" };
  }
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){}
  const total=arr.length, typeCount=arr.filter(r=> r.typeCode===code).length;
  return { total, typeCount, pct: total?Math.round(typeCount/total*1000)/10:0, src:"local" };
}
function axisMeterHTML(accent){
  const g = QUESTIONS[4].opts[state.answers[4]].g;
  const lean = i => ((QUESTIONS[i].opts[state.answers[i]].val + g) + 1.5) / 3; // 0..1
  const tQ=lean(0), tC=lean(1), tS=lean(2), tM=lean(3);
  const poles=[
    {l:"即行動",val:tQ},{l:"挑戦",val:tC},{l:"スキル",val:tS},{l:"自分で",val:tM},
    {l:"計画",val:1-tQ},{l:"堅実",val:1-tC},{l:"人脈",val:1-tS},{l:"組織",val:1-tM}
  ];
  const cx=150, cy=120, R=74, lr=R+22;
  const ang=i=>(-90+i*45)*Math.PI/180;
  const pt=(i,r)=>[(cx+r*Math.cos(ang(i))).toFixed(1),(cy+r*Math.sin(ang(i))).toFixed(1)];
  const ring=r=>poles.map((_,i)=>pt(i,r).join(",")).join(" ");
  const spokes=poles.map((_,i)=>{const p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ddd0b6" stroke-width="1"/>`;}).join("");
  const data=poles.map((p,i)=>pt(i,Math.max(0.07,p.val)*R).join(",")).join(" ");
  const dots=poles.map((p,i)=>{const q=pt(i,Math.max(0.07,p.val)*R);return `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${accent}"/>`;}).join("");
  const labels=poles.map((p,i)=>{const q=pt(i,lr);const c=p.val>0.5?accent:"#b0a8b0";return `<text x="${q[0]}" y="${(parseFloat(q[1])+3.5).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" text-anchor="middle">${p.l}</text>`;}).join("");
  return `<div style="margin:2px 0 14px;text-align:center;">
      <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:${accent};margin-bottom:2px;">あなたの傾向（4軸）</div>
      <svg viewBox="0 0 300 240" width="100%" style="max-width:300px;display:block;margin:0 auto;">
        <polygon points="${ring(R)}" fill="none" stroke="rgba(236,72,153,.18)" stroke-width="1"/>
        <polygon points="${ring(R*0.5)}" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
        ${spokes}
        <polygon points="${data}" fill="${accent}" fill-opacity="0.22" stroke="${accent}" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>`;
}

/* QRから開いた閲覧者向け：結果が読めないときの案内（スタート画面には飛ばさない） */
function renderViewerNotice(){
  wrap.innerHTML = `<div class="rise" style="margin-top:16vh;text-align:center;">
    <div style="font-size:15px;letter-spacing:2px;color:#e84a8c;margin-bottom:14px;font-weight:700;">Re▶CAMPUS</div>
    <div style="font-size:50px;margin-bottom:10px;">✨</div>
    <h2 style="font-family:'Zen Maru Gothic','Noto Sans CJK JP',sans-serif;font-weight:900;font-size:22px;color:#e84a8c;line-height:1.5;margin:0 0 12px;">転職タイプ診断</h2>
    <p style="color:#8a8a96;font-size:14px;line-height:1.9;">この画面は、QRから結果を見るための<br>ページです。<br>診断は会場のブースでどうぞ！</p>
  </div>`;
}

refreshStats(); // 起動時にスプシ集計を先読み
// 起動時の振り分け：QR経由（=閲覧者）はスタート画面に飛ばさない
(function(){
  let a=null, n=null;
  try { const p=new URLSearchParams(location.search); a=p.get("a"); n=p.get("n"); } catch(e){}
  let sa=null, sn=null;
  try { sa=sessionStorage.getItem("va"); sn=sessionStorage.getItem("vn"); } catch(e){}
  let viewer=false, ans=null, nm="";
  if(a!==null){                           // QRから来た（aパラメータあり）→ 閲覧者
    viewer=true;
    if(/^[0-2]{5}$/.test(a)){ ans=a; nm=n||""; try{ sessionStorage.setItem("va",a); sessionStorage.setItem("vn",nm); }catch(e){} }
    else if(sa && /^[0-2]{5}$/.test(sa)){ ans=sa; nm=sn||""; }   // 壊れたら直前の結果を復元
  } else if(sa && /^[0-2]{5}$/.test(sa)){   // 以前QRで開いた端末（URLを丸ごと消した等）
    viewer=true; ans=sa; nm=sn||"";
  }
  const isResultPage = location.pathname.indexOf("shindan_result") >= 0;
  if(viewer){
    if(ans){
      state.answers=ans.split("").map(Number);
      state.name=nm;
      state.type=determineType(state.answers);
      renderResult(true);                  // 閲覧モード（保存・送信しない）
    } else {
      renderViewerNotice();                // 結果が復元できないときも、スタートには戻さない
    }
  } else if(isResultPage){
    renderViewerNotice();                  // 結果専用ページに直接来た（aなし）→ スタートは出さない
  } else {
    renderIntro();                         // ブース（通常フロー）
  }
})();
</script>
