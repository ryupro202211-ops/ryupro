<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 合同会社ryupro</title>
  <meta name="description" content="合同会社ryuproへのお問い合わせはこちらから。イベント参加や事業に関するご質問など、お気軽にどうぞ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-bg: #111110;
      --color-bg-soft: #161514;
      --color-bg-card: #1a1918;
      --color-text: #a99f92;
      --color-text-strong: #e8e2d8;
      --color-text-dim: #6b655c;
      --color-gold: #dbc5a4;
      --color-gold-dim: rgba(219,197,164,0.4);
      --color-border: #2a2825;
      --font-ja: 'Noto Sans JP', sans-serif;
      --font-serif: 'Shippori Mincho', serif;
      --font-en: 'Outfit', sans-serif;
      --max-width: 1080px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ja);
      font-weight: 300;
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 2;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--color-gold); color: #111110; }

    /* --- NAV --- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(17,17,16,0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(42,40,37,0.6);
    }
    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .nav-logo {
      font-family: var(--font-en);
      font-weight: 400;
      font-size: 1.25rem;
      letter-spacing: 0.28em;
      color: var(--color-gold);
      text-decoration: none;
    }
    .nav-back {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--color-text);
      text-decoration: none;
      transition: color 0.4s;
    }
    .nav-back:hover { color: var(--color-gold); }

    /* --- PAGE HEADER --- */
    .page-header {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 9.5rem 2rem 2rem;
      text-align: center;
      background:
        radial-gradient(ellipse 50% 60% at 50% 0%, rgba(219,197,164,0.05), transparent 70%);
    }
    .section-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--color-text-dim);
      margin-bottom: 1.75rem;
    }
    .section-label .en {
      font-family: var(--font-en);
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }
    .section-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(1.6rem, 3.4vw, 2.2rem);
      letter-spacing: 0.12em;
      color: var(--color-gold);
      margin-bottom: 1.5rem;
    }
    .page-intro {
      font-size: 0.9rem;
      color: var(--color-text);
      max-width: 480px;
      margin: 0 auto;
      line-height: 2.3;
    }

    /* --- FORM --- */
    .form-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 3.5rem 2rem 6rem;
    }
    .form-group {
      margin-bottom: 2.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--color-text-strong);
      margin-bottom: 0.75rem;
    }
    .form-label .required {
      font-size: 0.7rem;
      color: var(--color-gold);
      margin-left: 0.5rem;
      letter-spacing: 0.1em;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 0.95rem 1.1rem;
      font-family: var(--font-ja);
      font-weight: 300;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      color: var(--color-text-strong);
      background: var(--color-bg-soft);
      border: 1px solid var(--color-border);
      border-radius: 0;
      outline: none;
      transition: border-color 0.5s var(--ease), background 0.5s var(--ease);
    }
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--color-gold-dim);
      background: var(--color-bg-card);
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--color-text-dim);
    }
    .form-textarea {
      min-height: 200px;
      resize: vertical;
      line-height: 2.1;
    }
    .form-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.1rem 2rem;
      font-family: var(--font-ja);
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--color-gold);
      background: transparent;
      border: 1px solid var(--color-gold-dim);
      border-radius: 0;
      cursor: pointer;
      transition: background 0.5s var(--ease), color 0.5s var(--ease), border-color 0.5s var(--ease);
    }
    .form-submit:hover {
      background: var(--color-gold);
      border-color: var(--color-gold);
      color: #111110;
    }

    /* --- FOOTER --- */
    footer {
      padding: 4rem 2rem 3.5rem;
      text-align: center;
      border-top: 1px solid var(--color-border);
    }
    .footer-logo {
      font-family: var(--font-en);
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.32em;
      margin-bottom: 1rem;
      color: var(--color-gold);
    }
    .footer-copy {
      font-family: var(--font-en);
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }

    @media (max-width: 768px) {
      .page-header { padding: 8rem 1.5rem 1.5rem; }
      .form-wrapper { padding: 2.5rem 1.5rem 4.5rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/ryupro/" class="nav-logo">ryupro</a>
    <a href="/ryupro/" class="nav-back">&larr; トップに戻る</a>
  </div>
</nav>

<header class="page-header">
  <div class="section-label">お問い合わせ<span class="en">Contact</span></div>
  <h1 class="section-title">最初の一歩を、ここから。</h1>
  <p class="page-intro">イベントへの参加や事業についてのご質問など、どんなことでもお気軽にご連絡ください。</p>
</header>

<main class="form-wrapper">
  <form id="contactForm">
    <div class="form-group">
      <label class="form-label" for="name">お名前<span class="required">※必須</span></label>
      <input class="form-input" type="text" id="name" name="name" placeholder="山田 太郎" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">メールアドレス<span class="required">※必須</span></label>
      <input class="form-input" type="email" id="email" name="email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="subject">件名</label>
      <input class="form-input" type="text" id="subject" name="subject" placeholder="ご用件">
    </div>
    <div class="form-group">
      <label class="form-label" for="message">お問い合わせ内容<span class="required">※必須</span></label>
      <textarea class="form-textarea" id="message" name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
    </div>
    <button type="submit" class="form-submit">送信する</button>
  </form>
</main>

<footer>
  <div class="footer-logo">ryupro</div>
  <div class="footer-copy">&copy; 2024 ryupro LLC. All Rights Reserved.</div>
</footer>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const subject = document.getElementById('subject').value || 'お問い合わせ';
    const message = document.getElementById('message').value;

    const body = `お名前: ${name}\nメールアドレス: ${email}\n\n${message}`;
    const mailto = `mailto:ryupro202211@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  });
</script>
</body>
</html>
