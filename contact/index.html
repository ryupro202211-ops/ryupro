<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/favicon.png">
    <title>Contact | 合同会社ryupro</title>
    <meta name="description" content="合同会社ryuproへのお問い合わせページです。起業・転職、引越し、イベント、ウェルネス等の事業に関するご相談はこちらから。">

    <!-- OGP -->
    <meta property="og:title" content="Contact | 合同会社ryupro">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://ryupro202211-ops.github.io/ryupro/contact/">
    <meta property="og:image" content="https://ryupro202211-ops.github.io/ryupro/assets/images/ogp.jpg">
    <meta property="og:site_name" content="合同会社ryupro">
    <meta property="og:description" content="合同会社ryuproへのお問い合わせページです。">

    <link rel="canonical" href="https://ryupro202211-ops.github.io/ryupro/contact/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .contact-page {
            padding-top: 120px;
            padding-bottom: 80px;
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text);
        }

        .form-label .required {
            color: #d00;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .form-textarea {
            height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background-color: var(--color-primary);
            color: #fff;
            border: none;
            padding: 1rem 3rem;
            font-family: var(--font-en);
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .submit-btn:hover {
            background-color: var(--color-bg-dark);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header id="header" class="header">
        <div class="container header-container">
            <a href="../index.html" class="logo">ryupro</a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="../index.html#philosophy">理念</a></li>
                    <li><a href="../index.html#services">事業内容</a></li>
                    <li><a href="../index.html#company">会社概要</a></li>
                    <li><a href="../blog/index.html">ブログ</a></li>
                    <li><a href="index.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <button class="mobile-menu-btn" aria-label="メニューを開く">
                <i data-lucide="menu"></i>
            </button>
        </div>
        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu">
            <ul class="mobile-nav-list">
                <li><a href="../index.html#philosophy">理念</a></li>
                <li><a href="../index.html#services">事業内容</a></li>
                <li><a href="../index.html#company">会社概要</a></li>
                <li><a href="../blog/index.html">ブログ</a></li>
                <li><a href="index.html">お問い合わせ</a></li>
            </ul>
            <button class="close-menu-btn" aria-label="メニューを閉じる">
                <i data-lucide="x"></i>
            </button>
        </div>
    </header>

    <main class="contact-page">
        <div class="container">
            <div class="section-header">
                <h1 class="section-title">Contact</h1>
                <p class="section-subtitle">お問い合わせ</p>
            </div>

            <div class="form-container reveal-up">
                <form action="https://formsubmit.co/ryupro202211@gmail.com" method="POST">
                    <!-- Config Fields -->
                    <input type="hidden" name="_next" id="redirectUrl">
                    <input type="hidden" name="_subject" value="【ryupro】Webサイトからのお問い合わせ">
                    <input type="hidden" name="_captcha" value="true">

                    <div class="form-group">
                        <label class="form-label" for="name">お名前 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" class="form-input" required placeholder="山田 太郎">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">メールアドレス <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-input" required
                            placeholder="example@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="subject">件名</label>
                        <input type="text" id="subject" name="subject" class="form-input" placeholder="ご用件">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">お問い合わせ内容 <span class="required">*</span></label>
                        <textarea id="message" name="message" class="form-textarea" required
                            placeholder="お問い合わせ内容をご記入ください"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">送信する</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">ryupro</div>
                <p class="footer-message">Creating Professional Value</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; <span class="js-year">2024</span> ryupro LLC. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        lucide.createIcons();
        document.querySelector('.js-year').textContent = new Date().getFullYear();
        document.getElementById('redirectUrl').value = new URL('thanks.html', window.location.href).href;
    </script>
</body>

</html>
