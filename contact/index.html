<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 合同会社ryupro</title>
  <meta name="description" content="合同会社ryuproへのお問い合わせはこちらから。イベント参加や事業に関するご質問など、お気軽にどうぞ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-bg: #0a0a0a;
      --color-bg-card: #141414;
      --color-text: #f0f0f0;
      --color-text-muted: #999;
      --color-text-light: #555;
      --color-accent: #39FF14;
      --color-accent-2: #FF6B2B;
      --color-border: #2a2a2a;
      --font-ja: 'Noto Sans JP', sans-serif;
      --font-en: 'Outfit', sans-serif;
      --max-width: 1080px;
      --glow-green: 0 0 20px rgba(57,255,20,0.4);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ja);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* --- NAV --- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
    }
    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .nav-logo {
      font-family: var(--font-en);
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--color-accent);
      text-decoration: none;
      letter-spacing: -0.02em;
      text-shadow: var(--glow-green);
    }
    .nav-back {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .nav-back:hover {
      color: var(--color-accent);
      text-shadow: var(--glow-green);
    }

    /* --- PAGE HEADER --- */
    .page-header {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 8rem 2rem 1.5rem;
      text-align: center;
    }
    .section-label {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      text-shadow: var(--glow-green);
    }
    .section-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .page-intro {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      max-width: 480px;
      margin: 0 auto;
    }

    /* --- FORM --- */
    .form-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }
    .form-group {
      margin-bottom: 1.75rem;
    }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .form-label .required {
      font-size: 0.75rem;
      color: var(--color-accent);
      margin-left: 0.35rem;
      font-weight: 500;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--font-ja);
      font-size: 0.95rem;
      color: var(--color-text);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 12px rgba(57,255,20,0.15);
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--color-text-light);
    }
    .form-textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.8;
    }
    .form-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1rem 2rem;
      font-family: var(--font-ja);
      font-size: 0.95rem;
      font-weight: 700;
      color: #0a0a0a;
      background: var(--color-accent);
      border: 2px solid var(--color-accent);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .form-submit:hover {
      background: transparent;
      color: var(--color-accent);
      box-shadow: var(--glow-green);
    }

    /* --- FOOTER --- */
    footer {
      padding: 3rem 2rem;
      text-align: center;
      border-top: 1px solid var(--color-border);
    }
    .footer-logo {
      font-family: var(--font-en);
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--color-accent);
      text-shadow: var(--glow-green);
    }
    .footer-copy {
      font-size: 0.75rem;
      color: var(--color-text-light);
    }

    @media (max-width: 768px) {
      .page-header { padding: 6rem 1.5rem 1.5rem; }
      .form-wrapper { padding: 2rem 1.5rem 3rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/ryupro/" class="nav-logo">ryupro</a>
    <a href="/ryupro/" class="nav-back">&larr; トップに戻る</a>
  </div>
</nav>

<header class="page-header">
  <div class="section-label">Contact</div>
  <h1 class="section-title">お問い合わせ</h1>
  <p class="page-intro">イベントへの参加や事業についてのご質問など、どんなことでもお気軽にご連絡ください。</p>
</header>

<main class="form-wrapper">
  <form id="contactForm">
    <div class="form-group">
      <label class="form-label" for="name">お名前<span class="required">*</span></label>
      <input class="form-input" type="text" id="name" name="name" placeholder="山田 太郎" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">メールアドレス<span class="required">*</span></label>
      <input class="form-input" type="email" id="email" name="email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="subject">件名</label>
      <input class="form-input" type="text" id="subject" name="subject" placeholder="ご用件">
    </div>
    <div class="form-group">
      <label class="form-label" for="message">お問い合わせ内容<span class="required">*</span></label>
      <textarea class="form-textarea" id="message" name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
    </div>
    <button type="submit" class="form-submit">送信する</button>
  </form>
</main>

<footer>
  <div class="footer-logo">ryupro</div>
  <div class="footer-copy">&copy; 2024 ryupro LLC. All Rights Reserved.</div>
</footer>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const subject = document.getElementById('subject').value || 'お問い合わせ';
    const message = document.getElementById('message').value;

    const body = `お名前: ${name}\nメールアドレス: ${email}\n\n${message}`;
    const mailto = `mailto:ryupro202211@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  });
</script>
</body>
</html>
