:root {

  --accent: #1f6f5c;
  --accent-soft: #dcece6;
  --gold: #b7891f;
  --warn: #c94a3f;
  --tag-a: #eaf3ee;
  --tag-b: #efe9d9;

* { box-sizing: border-box; }
body {

  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;

  color: var(--ink);
  line-height: 1.55;

}
header.hero {
  background: linear-gradient(135deg, #1f6f5c 0%, #2a8a72 100%);
  color: white;
  padding: 30px 20px 24px;
  text-align: center;
}
header.hero h1 {
  margin: 0 0 6px;
  font-size: 22px;
  letter-spacing: 0.02em;
  font-weight: 600;
}
header.hero .sub {
  font-size: 13px;
  opacity: 0.92;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}
.criteria {
  background: white;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.criteria h2 {
  margin: 0 0 12px;
  font-size: 15px;
  color: var(--accent);
  letter-spacing: 0.02em;
}
.criteria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px 20px;
  font-size: 13px;
}
.criteria-grid div span:first-child {
  color: var(--ink-sub);
  font-size: 11px;
  display: block;
}
.criteria-grid div span:last-child {
  font-weight: 600;
}
.priorities {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--ink-sub);
}
.priorities strong { color: var(--ink); }

.controls {
  background: white;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
}
.controls > * { flex: 0 0 auto; }
.control-group {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
}
.control-group label {
  color: var(--ink-sub);
  font-size: 12px;
}
.chip {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: white;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.chip:hover { border-color: var(--accent); }
.chip.on {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
select {
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  font-size: 12.5px;
  color: var(--ink);
}
.count-badge {
  margin-left: auto;
  font-size: 12.5px;
  color: var(--ink-sub);
  font-weight: 500;
}
.count-badge strong {
  color: var(--accent);
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px 18px 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.09);
}
.card.hidden { display: none; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.card-name {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}
.card-name-sub {
  font-size: 11.5px;
  color: var(--ink-sub);
  margin-top: 2px;
}
.card-price {
  text-align: right;
  flex-shrink: 0;
}
.card-price .total {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.card-price .breakdown {
  font-size: 10.5px;
  color: var(--ink-sub);
  margin-top: 3px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 12px;
}
.tag {
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--tag-a);
  color: var(--accent);
  font-weight: 500;
}
.tag.new { background: var(--tag-b); color: var(--gold); }
.tag.warn { background: var(--tag-c); color: var(--warn); }

.meta-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px 12px;
  font-size: 12px;
  margin-bottom: 12px;
  padding: 10px 12px;
  background: #faf9f4;
  border-radius: 8px;
}
.meta-row div span:first-child {
  color: var(--ink-sub);
  font-size: 10.5px;
  display: block;
}
.meta-row div span:last-child {
  font-weight: 600;
  font-size: 12.5px;
}
.notes {
  font-size: 12px;
  color: var(--ink-sub);
  line-height: 1.55;
  padding: 8px 0 12px;
  border-top: 1px dashed var(--line);
  margin-top: auto;
}
.notes strong { color: var(--ink); }
.pros-list {
  margin: 6px 0 12px;
  padding-left: 20px;
  font-size: 12px;
  color: var(--ink);
  line-height: 1.55;
}
.pros-list li {
  margin-bottom: 4px;
}
.pros-list li::marker {
  color: var(--accent);
}
.new-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ff5252, #d63a3a);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.05em;
  margin-right: 6px;
  vertical-align: middle;
  box-shadow: 0 1px 3px rgba(214,58,58,0.35);
}
.added-date {
  font-size: 10.5px;
  color: var(--ink-sub);
  text-align: right;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
  margin-top: 8px;
}
.contact-note {
  font-size: 11.5px;
  color: var(--ink-sub);
  text-align: center;
  padding: 10px 0 6px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}
.contact-note strong { color: var(--accent); }
.actions {

  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  margin-top: 8px;

.btn {
  flex: 1;
  text-align: center;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s;
  border: none;
  cursor: pointer;

.btn-primary {
  background: var(--accent);
  color: white;

.btn-primary:hover { background: #175a4a; }
.btn-secondary {
  background: white;

.btn-secondary:hover { background: var(--accent-soft); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;

.modal-backdrop.on { display: flex; }
.modal {

  border-radius: 12px;
  width: min(1000px, 100%);
  height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {

  border-bottom: 1px solid var(--line);

  justify-content: space-between;
  align-items: center;
}
.modal-title { font-weight: 600; font-size: 14px; }
.modal-close {

  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--ink-sub);
  padding: 0 6px;

.modal iframe {

  border: none;
  width: 100%;

.empty {

  background: white;

  border: 1px dashed var(--line);
  grid-column: 1 / -1;

footer.foot {

  padding: 24px 20px 40px;

  font-size: 11.5px;

@media (max-width: 640px) {

  header.hero h1 { font-size: 18px; }
  .card { padding: 14px 14px 12px; }

}

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');

function fmt(n) { return n.toLocaleString('ja-JP'); }

const NEW_SINCE = '2026-07-07';

function cardHtml(p) {
  const tagsHtml = p.tags.map(t => `<span class="tag ${t.c||''}">${t.t}</span>`).join('');
  const unitStr = p.unit ? ` ${p.unit}` : '';
  const isNew = p.addedAt && p.addedAt >= NEW_SINCE;
  const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';
  const dateStr = p.addedAt ? p.addedAt.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$1年$2月$3日') : '';
  return `
    <div class="card" data-id="${p.id}" data-line="${p.line}" data-layout="${p.layout}" data-total="${p.total}" data-size="${p.size}" data-walk="${p.walk}" data-year="${p.year}">
      <div class="card-header">
        <div>
          <div class="card-name">${newBadge}${p.name}${unitStr}</div>
          <div class="card-name-sub">${p.line} ${p.station}駅 徒歩${p.walk}分</div>
        </div>
        <div class="card-price">
          <div class="total">${fmt(p.total)}<span style="font-size:11px">円</span></div>
          <div class="breakdown">賃料 ${fmt(p.rent)} + 管理 ${fmt(p.kanri)}</div>
        </div>
      </div>
      <div class="tags">${tagsHtml}</div>
      <div class="meta-row">
        <div><span>広さ</span><span>${p.size}㎡</span></div>
        <div><span>間取り</span><span>${p.layout}</span></div>
        <div><span>築年</span><span>${p.year}年（築${2026 - p.year}年）</span></div>
        <div><span>構造</span><span>${p.structure}</span></div>
        <div><span>敷金</span><span>${p.deposit}</span></div>
        <div><span>礼金</span><span>${p.reikin}</span></div>
      </div>
      <div class="notes">
        <strong>おすすめポイント</strong>
        <ul class="pros-list">${p.pros.map(x => `<li>${x}</li>`).join('')}</ul>
        ${p.cons && p.cons.length ? `<strong>ご留意点</strong><ul class="pros-list">${p.cons.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      </div>
      ${p.driveId ? `
      <div class="actions">
        <button class="btn btn-primary" onclick="openPreview('${p.driveId}', '${p.name}${unitStr}')">📐 図面プレビュー</button>
        <a class="btn btn-secondary" href="https://drive.google.com/file/d/${p.driveId}/view" target="_blank" rel="noopener">別タブで開く</a>
      </div>` : `
      <div class="contact-note">
        図面・詳細情報・内見のご希望は<strong>ご担当までLINE等でお問い合わせ</strong>ください
      </div>`}
      ${dateStr ? `<div class="added-date">物件情報の登録日：${dateStr}</div>` : ''}
    </div>
  `;
}

function renderAll() {
  grid.innerHTML = PROPERTIES.map(cardHtml).join('');
  applyFilters();
}

const state = {
  line: 'all',
  layout: 'all',
  sort: 'rent-asc',
  rentcap: 100000,
};

document.querySelectorAll('.control-group[data-filter="line"] .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.control-group[data-filter="line"] .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    state.line = c.dataset.value;
    applyFilters();
  });
});
document.querySelectorAll('.control-group[data-filter="layout"] .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.control-group[data-filter="layout"] .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    state.layout = c.dataset.value;
    applyFilters();
  });
});
document.getElementById('sort').addEventListener('change', e => {
  state.sort = e.target.value;
  applyFilters();
});
document.getElementById('rentcap').addEventListener('change', e => {
  state.rentcap = parseInt(e.target.value, 10);
  applyFilters();
});

function applyFilters() {
  const cards = Array.from(grid.querySelectorAll('.card'));
  const filtered = cards.filter(card => {
    if (state.line !== 'all' && card.dataset.line !== state.line) return false;
    if (state.layout !== 'all' && card.dataset.layout !== state.layout) return false;
    if (parseInt(card.dataset.total, 10) > state.rentcap) return false;
    return true;
  });
  filtered.sort((a, b) => {
    const ka = a.dataset, kb = b.dataset;
    switch (state.sort) {
      case 'rent-asc': return (+ka.total) - (+kb.total);
      case 'size-desc': return (+kb.size) - (+ka.size);
      case 'walk-asc': return (+ka.walk) - (+kb.walk);
      case 'age-asc': return (+kb.year) - (+ka.year);
    }
    return 0;
  });
  cards.forEach(c => c.classList.add('hidden'));
  filtered.forEach(c => {
    c.classList.remove('hidden');
    grid.appendChild(c);
  });
  countEl.textContent = filtered.length;

  if (filtered.length === 0) {
    if (!grid.querySelector('.empty')) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '条件に合う物件がありません。フィルタを緩めてお試しください。';
      grid.appendChild(empty);
    }
  } else {
    const existing = grid.querySelector('.empty');
    if (existing) existing.remove();
  }
}

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalFrame = document.getElementById('modal-frame');

function openPreview(driveId, name) {
  modalTitle.textContent = '図面プレビュー：' + name;
  modalFrame.src = `https://drive.google.com/file/d/${driveId}/preview`;
  modal.classList.add('on');
}
document.getElementById('modal-close').addEventListener('click', () => {
  modal.classList.remove('on');
  modalFrame.src = '';
});
modal.addEventListener('click', e => {
  if (e.target === modal) {
    modal.classList.remove('on');
    modalFrame.src = '';
  }
});

renderAll();
</script>
