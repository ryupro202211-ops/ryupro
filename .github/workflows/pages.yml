name: Deploy GitHub Pages (auto-retry)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static site
        run: npm run build:site
      - name: Check publish output
        run: npm run check:site
      - name: Run unit tests
        run: npm run test:unit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (30s)
        if: steps.try1.outcome != 'success'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: try2
        if: steps.try1.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry (60s)
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success'
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 3 - final)
        id: try3
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success'
        uses: actions/deploy-pages@v4
      - name: Report deployment result
        id: final
        run: |
          if [ "${{ steps.try1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.try1.outputs.page_url }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.try2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.try2.outputs.page_url }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.try3.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.try3.outputs.page_url }}" >> $GITHUB_OUTPUT
          fi
